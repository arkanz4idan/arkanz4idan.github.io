<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Void.System Blog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background -->
    <div class="background"></div>

    <!-- Main site logo -->
    <a class="logo" href="../">
        <img src="../assets/logo.png" alt="VoidSystem">
    </a>

    <!-- Void.System -->
    <img
        class="void-system"
        src="../assets/Void.System.png"
        alt="Void.System"
    >

    <a id="account-button" class="account-button" href="in.html">
        <span>ACCOUNT</span>
        <img
            id="account-avatar"
            src="../assets/logo.png"
            alt="Account"
        >
    </a>

    <!-- Blog title -->
    <header class="blog-header">
        <h1 id="page-title">BLOG TITLE</h1>
    </header>

    <!-- Blog content -->
    <main class="blog-container">
        <article class="blog-content" id="content">
            <p>Loading...</p>
        </article>
    </main>

    <section class="subscription">
        <h2>SUBSCRIBE</h2>

        <p>
            Get notified when a new post is published.
        </p>

        <div class="subscription-form">
            <input
                id="subscription-email"
                type="email"
                placeholder="Your email"
                autocomplete="email"
            >

            <button id="subscription-submit">
                SUBSCRIBE
            </button>
        </div>

        <p id="subscription-status"></p>
    </section>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="scripts/data.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
